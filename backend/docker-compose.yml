services:
  postgres:
    image: postgres:17-alpine
    container_name: incidencias-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-incidencias}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-incidencias}
      POSTGRES_DB: ${DB_NAME:-incidencias}
      TZ: America/Lima
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-incidencias}"]
      interval: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: incidencias-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@inst.edu
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
